<div class="stage">
  <section class="auth">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M6 5.5h12M6 5.5v14M6 10h12M6 14.5h8" />
      </svg>
    </span>
    <h1>Register</h1>
    <p class="lead">Start a list and invite someone onto it. The password needs at least 10 characters.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Name
        <input type="text" formControlName="display_name" autocomplete="nickname" />
      </label>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="busy()">Create account</button>
    </form>
    <p class="aside">Already registered. <a routerLink="/login">Log in</a></p>
  </section>
</div>
