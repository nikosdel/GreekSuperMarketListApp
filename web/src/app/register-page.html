<div class="stage">
  <section class="auth-layout">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M6 6h15l-1.6 8.2a1 1 0 0 1-1 .8H9.2a1 1 0 0 1-1-.8L6 6Z" />
          <path d="M6 6 5 3.5H3" />
          <circle cx="9" cy="19" r="1.3" />
          <circle cx="17" cy="19" r="1.3" />
        </svg>
      </span>
      <p class="brand-title">Lists</p>
      <p>Compare a price, then share the list with someone else.</p>
    </div>
  <section class="auth">
    <h1>Register</h1>
    <p class="lead">Start a list and invite someone onto it. The password needs at least 10 characters.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Name
        <input type="text" formControlName="display_name" autocomplete="nickname" />
      </label>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="busy()">Create account</button>
    </form>
    <p class="aside">Already registered. <a routerLink="/login">Log in</a></p>
  </section>
  </section>
</div>
