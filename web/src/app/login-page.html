<div class="auth-stage">
  <section class="auth-layout">
    <button class="auth-language" type="button" [attr.aria-label]="'lang.switch' | t" (click)="language.toggle()">
      {{ language.code() === 'el' ? 'EN' : 'ΕΛ' }}
    </button>
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M7 4.5h12v15H7zM4 7.5h3M4 11h3M4 14.5h3M10 8.5h6M10 12h6M10 15.5h4" />
        </svg>
      </span>
      <p class="brand-title">Super Market List</p>
      <p>{{ 'brand.tagline' | t }}</p>
    </div>
    <section class="auth-panel">
      <h1>{{ 'auth.login' | t }}</h1>
      <p class="lead">{{ 'auth.loginLead' | t }}</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          {{ 'auth.email' | t }}
          <input type="email" formControlName="email" autocomplete="username" />
        </label>
        <label>
          {{ 'auth.password' | t }}
          <input type="password" formControlName="password" autocomplete="current-password" />
        </label>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button class="primary" type="submit" [disabled]="busy()">
          {{ busy() ? ('common.loading' | t) : ('auth.login' | t) }}
        </button>
      </form>
      <p class="aside">{{ 'auth.noAccount' | t }} <a routerLink="/register">{{ 'auth.registerLink' | t }}</a></p>
    </section>
  </section>
</div>
