<div class="stage">
  <section class="auth">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M6 5.5h12M6 5.5v14M6 10h12M6 14.5h8" />
      </svg>
    </span>
    <h1>Log in</h1>
    <p class="lead">Open the lists you share.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="busy()">Log in</button>
    </form>
    <p class="aside">No account yet. <a routerLink="/register">Register</a></p>
  </section>
</div>
