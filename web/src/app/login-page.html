<section class="auth">
  <h1>Log in</h1>
  <p class="lead">The access token expires after 15 minutes. The app refreshes it while you stay signed in.</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="primary" type="submit" [disabled]="busy()">Log in</button>
  </form>
  <p class="aside">No account yet. <a routerLink="/register">Register</a></p>
</section>
