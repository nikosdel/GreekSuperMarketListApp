<div class="app">
  <button type="button" class="scrim" [class.open]="menuOpen()" aria-label="Close menu" (click)="menuOpen.set(false)"></button>
  <aside class="sidebar bg-ground text-ink" [class.open]="menuOpen()">
    <a class="mark" routerLink="/" (click)="menuOpen.set(false)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5.5h12M6 5.5v14M6 10h12M6 14.5h8" />
      </svg>
      <span>Lists</span>
    </a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }" (click)="menuOpen.set(false)">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h7v6H4zM13 14h7v6h-7z" /></svg>
        Dashboard
      </a>
      <a routerLink="/catalog" routerLinkActive="active" (click)="menuOpen.set(false)">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" /></svg>
        Categories
      </a>
      <a routerLink="/lists" routerLinkActive="active" [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }" (click)="menuOpen.set(false)">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h15l-1.6 8.2a1 1 0 0 1-1 .8H9.2a1 1 0 0 1-1-.8L6 6Z" /><path d="M6 6 5 3.5H3" /><circle cx="9" cy="19" r="1.3" /><circle cx="17" cy="19" r="1.3" /></svg>
        Lists
      </a>
      <a routerLink="/history" routerLinkActive="active" (click)="menuOpen.set(false)">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><path d="M12 8v5l3 2" /></svg>
        History
      </a>
    </nav>
    <div class="sidebar-foot">
      <span class="who">{{ account()?.display_name }}</span>
      <button class="text" type="button" (click)="logout()">Log out</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar bg-green">
      <button class="text menu-button" type="button" (click)="toggleMenu()">Menu</button>
      <p class="section">{{ section() }}</p>
      <div class="tools">
      @if (openLists().length) {
        <label class="active-list">
          <select aria-label="List you are shopping" [value]="activeId() || ''" (change)="chooseList($any($event.target).value)">
            @for (list of openLists(); track list.id) {
              <option [value]="list.id">{{ list.title }}</option>
            }
          </select>
        </label>
      }
      <a class="icon-button" [routerLink]="cartLink()" aria-label="Shopping list" (click)="menuOpen.set(false)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h15l-1.6 8.2a1 1 0 0 1-1 .8H9.2a1 1 0 0 1-1-.8L6 6Z" />
          <path d="M6 6 5 3.5H3" />
          <circle cx="9" cy="19" r="1.3" />
          <circle cx="17" cy="19" r="1.3" />
        </svg>
      </a>
      <div class="bell-wrap" #bellRoot>
        <button class="bell" type="button" aria-label="Notices" (click)="toggleBell($event)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15Z" />
            <path d="M10 18a2 2 0 0 0 4 0" />
          </svg>
          @if (unread() > 0) {
            <span class="badge">{{ unread() > 9 ? '9+' : unread() }}</span>
          }
        </button>
        @if (bellOpen()) {
          <div class="bell-panel" (click)="$event.stopPropagation()">
            <p class="panel-title">Notices</p>
            @if (!notices().length) {
              <p class="muted">No notices yet.</p>
            } @else {
              <ul>
                @for (notice of notices(); track notice.id) {
                  <li>
                    <button type="button" [class.unread]="!notice.read_at" (click)="openNotice(notice)">
                      <span>{{ notice.message }}</span>
                      <span class="muted">{{ when(notice.created_at) }}</span>
                    </button>
                  </li>
                }
              </ul>
            }
          </div>
        }
      </div>
      </div>
    </header>
    <main class="canvas">
      <router-outlet />
    </main>
  </div>
</div>
