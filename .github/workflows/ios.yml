name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    name: Compile iPhone app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Compile the iOS app
        working-directory: web/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Pack the unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/App.app"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/SuperMarketList-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarketList-ios
          path: SuperMarketList-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
